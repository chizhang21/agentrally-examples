apiVersion: arally.io/v1alpha1
kind: AgentDefinition
metadata:
  name: http-api-agent
  namespace: agentrally-http-api-agent
spec:
  agentGroupRef:
    name: http-api-agent
  template: generic
  container:
    image: ghcr.io/chizhang21/agentrally-demo-agent:v0.0.3
    imagePullPolicy: IfNotPresent
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    ports:
    - name: http
      containerPort: 8080
    startupProbe:
      httpGet: {path: /healthz, port: http}
      periodSeconds: 2
      failureThreshold: 60
    readinessProbe:
      httpGet: {path: /healthz, port: http}
      periodSeconds: 5
    # Real model mode also requires the API_TOKEN from the same Secret.
    # env:
    # - name: API_TOKEN
    #   valueFrom:
    #     secretKeyRef: {name: http-api-agent-credentials, key: API_TOKEN}
  # Optional: create the Secret and configure your provider before enabling.
  # modelProvider:
  #   baseURL: https://models.example.com/v1
  #   model: your-model
  #   apiKeySecretRef: {name: http-api-agent-credentials, key: OPENAI_API_KEY}
