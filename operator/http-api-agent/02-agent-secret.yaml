apiVersion: v1
kind: Secret
metadata:
  name: http-api-agent-credentials
  namespace: agentrally-http-api-agent
type: Opaque
stringData:
  OPENAI_API_KEY: REPLACE_WITH_MODEL_API_KEY
  API_TOKEN: REPLACE_WITH_AGENT_API_TOKEN
